<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proof-n-brand · painel de leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23C6F73E'/><text x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23141414'>m</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="logo">m</div>
  <nav class="nav" id="nav">
    <button data-tab="leads" class="active">Leads <span class="count" id="nav-count">0</span></button>
    <button data-tab="cidades">Cidades</button>
    <button data-tab="categorias">Categorias</button>
  </nav>
  <div class="topbar-right">
    <button class="icon-btn" id="refresh" title="Recarregar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
    <div class="avatar">N</div>
  </div>
</header>

<main class="wrap">

  <div class="page-head">
    <div>
      <h1 id="page-title">Leads</h1>
      <p id="page-sub">Negócios com site ruim, prontos para abordagem</p>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="export-cat">Salvar por categoria</button>
      <button class="btn-dark" id="export"><span class="dot"></span> Exportar CSV</button>
    </div>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="filters" id="filters">
    <div class="quick" id="quick"></div>
    <div class="dd" data-key="city"></div>
    <div class="dd" data-key="category"></div>
    <div class="dd" data-key="status"></div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="Buscar por nome ou domínio…">
    </label>
  </section>

  <section id="content"></section>
</main>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
